# Fly.io deployment.
#
# NOTE: Fly removed its permanent free tier in 2024. New accounts pay from the
# first machine, so this config is correct but not free. Kept because the sizing
# and concurrency settings are still the right ones if you are paying. See
# DEPLOY.md for the options that are actually free.
#
# The service is CPU-bound and holds Stockfish in memory, so it is sized for a
# single always-on machine rather than autoscaling: a cold start would have to
# reload the NNUE network before answering.

app = "decodex"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  # Stopping the machine would mean reloading the network on the next request,
  # which reads as a broken site. Keep one warm.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    # Requests queue behind a single engine lock, so accepting hundreds only
    # converts a fast rejection into a slow timeout.
    soft_limit = 12
    hard_limit = 24

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
