[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decodex"
version = "0.1.0"
description = "Explain chess engine moves from verifiable facts"
requires-python = ">=3.10"
dependencies = ["chess>=1.11"]

[project.optional-dependencies]
web = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
]
dev = [
  "pytest>=8",
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "httpx==0.28.1",
]

[project.scripts]
decodex = "decodex.cli:main"

[tool.setuptools]
packages = ["decodex"]

[tool.setuptools.package-data]
decodex = ["static/*", "static/pieces/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engine: requires a local UCI engine binary"]
